
<div class="min-h-screen bg-light-bg dark:bg-dark-bg flex items-center justify-center p-4 overflow-hidden">
  <div class="w-full max-w-5xl mx-auto bg-light-card dark:bg-dark-card rounded-2xl shadow-2xl flex overflow-hidden">
    
    <!-- Left Side - Neon Animation -->
    <div class="hidden md:flex md:w-1/2 relative bg-gray-900 items-center justify-center overflow-hidden">
      
      <!-- Glitter Background -->
      <div class="absolute inset-0 w-full h-full pointer-events-none">
        <div class="star" style="top: 10%; left: 20%; animation-delay: 0s;"></div>
        <div class="star" style="top: 30%; left: 80%; animation-delay: 1s;"></div>
        <div class="star" style="top: 50%; left: 40%; animation-delay: 2s;"></div>
        <div class="star" style="top: 70%; left: 10%; animation-delay: 0.5s;"></div>
        <div class="star" style="top: 80%; left: 70%; animation-delay: 1.5s;"></div>
        <div class="star" style="top: 20%; left: 60%; animation-delay: 2.5s;"></div>
        <div class="star" style="top: 90%; left: 30%; animation-delay: 3s;"></div>
        <div class="star" style="top: 15%; left: 90%; animation-delay: 0.2s;"></div>
        <div class="star" style="top: 45%; left: 15%; animation-delay: 1.2s;"></div>
        <div class="star" style="top: 65%; left: 85%; animation-delay: 2.2s;"></div>
      </div>

      <!-- Floating Gifts -->
      <div class="gift-icon absolute text-4xl" style="top: 15%; left: 15%; animation-delay: 0s;">🎁</div>
      <div class="gift-icon absolute text-3xl" style="top: 75%; left: 80%; animation-delay: 1.5s;">🎁</div>
      <div class="gift-icon absolute text-5xl" style="top: 60%; left: 10%; animation-delay: 3s;">🎁</div>
      <div class="gift-icon absolute text-2xl" style="top: 20%; left: 85%; animation-delay: 2s;">🎁</div>
      <div class="gift-icon absolute text-4xl" style="top: 85%; left: 30%; animation-delay: 0.5s;">🎁</div>

      <!-- Neon Text -->
      <div class="z-10 text-center p-8">
        <h1 class="neon-text text-6xl font-bold tracking-wider mb-4">
          {{ websiteName || '3D Hub' }}
        </h1>
        <p class="text-blue-200 text-lg font-light tracking-widest uppercase opacity-80">
          Welcome Back
        </p>
      </div>
      
      <!-- Overlay Gradient for depth -->
      <div class="absolute inset-0 bg-gradient-to-br from-blue-900/20 to-purple-900/20 pointer-events-none"></div>
    </div>

    <!-- Right Side - Form -->
    <div class="w-full md:w-1/2 p-8 sm:p-12 flex flex-col justify-center">
      <div class="animate-fade-in-up">
        <h1 class="text-3xl font-bold text-light-text dark:text-dark-text mb-2">Sign In</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-8">Don't have an account? <a routerLink="/signup" class="font-semibold text-primary-light dark:text-primary-dark hover:underline">Sign up</a></p>

        <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-6">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email Address</label>
            <input type="email" id="email" formControlName="email" class="admin-input" placeholder="you@example.com">
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
            <div class="relative">
              <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" class="admin-input pr-10" placeholder="••••••••">
              <button type="button" (click)="showPassword.set(!showPassword())" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                @if (showPassword()) {
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a9.97 9.97 0 01-1.563 3.029m0 0l-2.117 2.116m-2.116-2.117l-3.29 3.29m7.532-7.532l-3.29-3.29M3 3l18 18"></path></svg>
                } @else {
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                }
              </button>
            </div>
          </div>
          
          @if(loginError()) {
            <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4" role="alert">
              <p>{{ loginError() }}</p>
            </div>
          }

          <button type="submit" [disabled]="loginForm.invalid || isLoading()"
                  class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary-light hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-light dark:bg-primary-dark dark:text-gray-900 dark:hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300">
            @if(isLoading()) {
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Signing In...</span>
            } @else {
              <span>Sign In</span>
            }
          </button>
        </form>
         <p class="text-center text-sm mt-8">
            <a routerLink="/home" class="font-medium text-primary-light dark:text-primary-dark hover:underline">
            &larr; Back to store
            </a>
        </p>
      </div>
    </div>
  </div>
</div>

<style>
  .animate-fade-in-up {
    animation: fadeInUp 0.6s ease-out forwards;
  }
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Neon Text Animation */
  .neon-text {
    color: #fff;
    text-shadow:
      0 0 5px #fff,
      0 0 10px #fff,
      0 0 20px #fff,
      0 0 40px #0ff,
      0 0 80px #0ff,
      0 0 90px #0ff,
      0 0 100px #0ff,
      0 0 150px #0ff;
    animation: neon-flicker 3s infinite alternate;
  }

  @keyframes neon-flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% {
      text-shadow:
        0 0 4px #fff,
        0 0 10px #fff,
        0 0 18px #fff,
        0 0 38px #0ff,
        0 0 73px #0ff,
        0 0 80px #0ff,
        0 0 94px #0ff,
        0 0 140px #0ff;
    }
    20%, 24%, 55% {
      text-shadow: none;
      opacity: 0.8;
    }
  }

  /* Glitter / Stars */
  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.9);
    animation: twinkle 2s infinite ease-in-out;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* Floating Gifts */
  .gift-icon {
    animation: float 4s ease-in-out infinite;
    filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
    opacity: 0.9;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
  }
</style>
